# docker-compose: chạy toàn bộ stack demo cùng lúc.
#
#   docker compose up -d --build
#   # app:      http://localhost:18080  (/healthz, /webhooks/github)
#   # Jaeger:   http://localhost:16686 (xem trace)
#   # Postgres: localhost:15432 (DBeaver); compose services use postgres:5432
#
# Postgres có healthcheck; service `app` chỉ khởi động sau khi Postgres
# báo healthy (depends_on: condition: service_healthy).
#
# Biến môi trường lấy từ file .env cùng thư mục (compose tự nạp) —
# xem .env.example. Mọi biến đều có giá trị mặc định để "up" được ngay
# cả khi chưa tạo .env.
services:
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: peo-jaeger
    environment:
      # Bật đầu vào OTLP (gRPC 4317 + HTTP 4318) trên Jaeger collector.
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"

  postgres:
    image: postgres:16-alpine
    container_name: peo-postgres
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-preview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-preview}
      POSTGRES_DB: ${POSTGRES_DB:-preview}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # App applies versioned migrations on startup, including existing volumes.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-preview} -d ${POSTGRES_DB:-preview}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: peo-app
    group_add:
      - "${DOCKER_GID:?Run node scripts/setup-local.mjs to configure Docker socket access}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      # Trong mạng compose, service khác gọi nhau bằng tên service.
      DATABASE_URL: postgres://${POSTGRES_USER:-preview}:${POSTGRES_PASSWORD:-preview}@postgres:5432/${POSTGRES_DB:-preview}?sslmode=disable
      STORAGE_DRIVER: ${STORAGE_DRIVER:-postgres}
      DOCKER_DRIVER: ${DOCKER_DRIVER:-mock}
      GITHUB_DRIVER: ${GITHUB_DRIVER:-mock}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-jaeger:4317}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      ORCHESTRATOR_CONTAINER: peo-app
      PREVIEW_REPOSITORY: ${PREVIEW_REPOSITORY:-psontay/todolist}
      PREVIEW_ALLOWED_ACTOR: ${PREVIEW_ALLOWED_ACTOR:-psontay}
      PREVIEW_QUOTA: ${PREVIEW_QUOTA:-5}
      PREVIEW_TTL: ${PREVIEW_TTL:-24h}
      DELETION_GRACE_PERIOD: ${DELETION_GRACE_PERIOD:-10m}
      CLEANUP_INTERVAL: ${CLEANUP_INTERVAL:-5s}
      PROVISION_TIMEOUT: ${PROVISION_TIMEOUT:-20m}
      PREVIEW_READY_TIMEOUT: ${PREVIEW_READY_TIMEOUT:-3m}
    ports:
      - "127.0.0.1:18080:8080"
    stop_grace_period: 120s

volumes:
  pgdata:
